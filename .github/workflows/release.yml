name: Release App

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build_and_release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Get Version
        id: get_version
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Publish App
        shell: bash
        run: |
          dotnet publish "Easy Copier/Easy Copier.csproj" -c Release -r win-x64 -p:Version=${{ steps.get_version.outputs.VERSION }} -p:AssemblyVersion=${{ steps.get_version.outputs.VERSION }} -p:FileVersion=${{ steps.get_version.outputs.VERSION }} -o publish_output

      - name: Install Velopack
        shell: bash
        run: dotnet tool install -g vpk

      - name: Create Velopack Release
        shell: bash
        run: vpk pack -u EasyCopier -v ${{ steps.get_version.outputs.VERSION }} -p publish_output -e "Easy Copier.exe"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            Releases/*-full.nupkg
            Releases/Setup.exe
            Releases/RELEASES
          generate_release_notes: true

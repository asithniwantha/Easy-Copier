name: CI x64 Compilation

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - '.github/**'
      - '**/.gitignore'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.ico'
      - 'LICENSE'

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build project (x64) and capture log
        id: build
        # We use continue-on-error so the workflow proceeds to the log checking step even if the build fails
        continue-on-error: true
        run: dotnet build "Easy Copier/Easy Copier.csproj" --configuration Release --arch x64 -v d -p:EnforceCodeStyleInBuild=true 2>&1 | tee build.log

        shell: bash

      - name: Check logs for warnings or errors
        id: check_logs
        run: |
          if grep -iE ": warning|: error" build.log > /dev/null; then
            echo "has_issues=true" >> $GITHUB_OUTPUT
          else
            echo "has_issues=false" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Trigger Jules if issues found
        if: steps.check_logs.outputs.has_issues == 'true' || steps.build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GHI_JULES_TOKEN || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          grep -iE ": warning|: error" build.log > issues.log || true

          echo "The following build issues were detected during CI:" > issue_body.md
          echo "" >> issue_body.md
          echo "\`\`\`" >> issue_body.md
          if [ -s issues.log ]; then
            cat issues.log >> issue_body.md
          fi
          echo "\`\`\`" >> issue_body.md

          issueUrl=$(gh issue create --title "Build Issues Detected in CI" --body-file issue_body.md --label "jules")
          gh issue comment "$issueUrl" --body "@jules Please review the recent build failure or warnings. Check the latest run on the main branch for details."

      - name: Fail workflow if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

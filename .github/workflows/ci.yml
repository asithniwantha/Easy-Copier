name: CI x64 Compilation

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build project (x64)
        run: dotnet build "Easy Copier/Easy Copier.csproj" --configuration Release --arch x64
